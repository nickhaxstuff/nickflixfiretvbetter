
name: Build NickFlix Fire TV APK

on:
  workflow_dispatch:
    inputs:
      site_url:
        description: NickFlix website URL
        required: true
        default: https://nickflix.netlify.app/
        type: string

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Configure Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: ''

      - name: Install Android SDK packages
        shell: bash
        run: |
          yes | sdkmanager --licenses || true
          sdkmanager --install \
            "platform-tools" \
            "platforms;android-35" \
            "build-tools;35.0.0"

      - name: Locate Android project
        shell: bash
        run: |
          if [ -f "./gradlew" ]; then
            echo "PROJECT_DIR=." >> "$GITHUB_ENV"
          elif [ -f "./NickFlix-FireTV-Shell/gradlew" ]; then
            echo "PROJECT_DIR=NickFlix-FireTV-Shell" >> "$GITHUB_ENV"
          else
            echo "ERROR: Gradle wrapper not found."
            echo "Repository files:"
            find . -maxdepth 3 -type f | head -200
            exit 1
          fi

      - name: Build APK
        env:
          SITE_URL: ${{ inputs.site_url }}
        shell: bash
        run: |
          cd "$PROJECT_DIR"
          chmod +x ./gradlew
          ./gradlew --no-daemon assembleDebug \
            -PsiteUrl="$SITE_URL"

      - name: Locate APK
        shell: bash
        run: |
          find . -type f -name '*.apk' -print

          APK=$(find "$PROJECT_DIR" -type f \
            -path '*/build/outputs/apk/*/*.apk' | head -n 1)

          if [ -z "$APK" ]; then
            echo "ERROR: Build finished without producing an APK."
            exit 1
          fi

          echo "APK_PATH=$APK" >> "$GITHUB_ENV"

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: NickFlix-FireTV-APK
          path: ${{ env.APK_PATH }}
          if-no-files-found: error
          retention-days: 14
